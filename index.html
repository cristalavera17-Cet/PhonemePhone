<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="PhonemePhone"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>PhonemePhone</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;background:#fff;color:#171717}main{max-width:500px;margin:auto;min-height:100vh;padding:50px 28px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}h1{font-size:clamp(30px,9vw,42px);letter-spacing:-1px;margin:0 0 10px}p{color:#596473;line-height:1.4}#status{font-size:14px}#card{transition:background .2s;width:100%;min-height:230px;margin:32px 0;background:#f1f5f9;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;color:#405166}#result{font-size:clamp(42px,12vw,66px);font-weight:700}#detail{font-size:19px;margin-top:10px}button{width:100%;border:0;border-radius:16px;background:#087cf0;color:white;padding:21px;font-size:20px;font-weight:600}button:disabled{background:#a7bfdb}footer{font-size:13px;color:#748090;margin-top:22px;line-height:1.45}</style></head><body><main><h1>PhonemePhone</h1><p>Escucha y descubre el sonido</p><p id="status" role="status">Cargando sonidos…</p><div id="card" aria-live="polite"><div id="result">🎙️</div><div id="detail">Pulsa Listen y pronuncia una vocal</div></div><button id="listen" disabled>Listen</button><footer id="offline">El audio se analiza en este dispositivo.</footer></main><script src="app.js" defer></script></body></html>
